version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: rag_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./documents:/app/documents
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION_NAME=excel_rag_collection
      - EXCEL_FILE_PATH=documents/knowledge_base.xlsx
    depends_on:
      - ollama
      - chromadb
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: always

volumes:
  ollama_data:
  chroma_data:
